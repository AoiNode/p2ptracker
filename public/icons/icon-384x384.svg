<svg width="384" height="384" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="76" fill="url(#bgGrad)"/>
  
  <!-- Chart bars -->
  <g transform="translate(256, 256)">
    <!-- Bar 1 -->
    <rect x="-140" y="20" width="50" height="100" fill="url(#chartGrad)" rx="8"/>
    <!-- Bar 2 -->
    <rect x="-60" y="-30" width="50" height="150" fill="url(#chartGrad)" rx="8"/>
    <!-- Bar 3 -->
    <rect x="20" y="0" width="50" height="120" fill="url(#chartGrad)" rx="8"/>
    <!-- Bar 4 - Trending up -->
    <rect x="100" y="-60" width="50" height="180" fill="url(#chartGrad)" rx="8"/>
    
    <!-- Trend line -->
    <path d="M -115 70 L -35 -5 L 45 25 L 125 -40" 
          stroke="white" 
          stroke-width="6" 
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.9"/>
    
    <!-- Trend arrow pointing up -->
    <g transform="translate(125, -40)">
      <path d="M 0 0 L 15 -15 L 15 0 M 15 -15 L 0 -15" 
            stroke="white" 
            stroke-width="6" 
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.9"/>
    </g>
  </g>
  
  <!-- P2P Text at bottom -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="72" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="white"
        opacity="0.95">P2P</text>
</svg>
